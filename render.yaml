services:
  - type: web
    name: bsma-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    preDeployCommand: "npx prisma migrate deploy --schema=./apps/api/prisma/schema.prisma"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bsma-postgres
          property: connectionString
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "2h"
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: REVALIDATE_SECRET
        generateValue: true

  - type: web
    name: bsma-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false

databases:
  - name: bsma-postgres
    plan: starter